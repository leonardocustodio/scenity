<!doctype html>
<!--
  A plain HTML page that plays the showroom with the web component of @scenity/player. The page has no
  editor code: one element and one script that defines it. The scene dev server serves it at /player/showroom.html.
-->
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Showroom player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000000;
        overflow: hidden;
      }
      scenity-player {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <scenity-player
      data-testid="player"
      src="/projects/showroom/scenity.project.json"
      scene="scenes/main.scene.json"
      camera="front"
    ></scenity-player>
    <script type="module" src="/src/player/element.ts"></script>
  </body>
</html>
