# Security headers of the editor build in the end-to-end tests (from the CodeBlue web learner app).
#
# The add_header lines came from engine/infra/nginx/web/snippets/web-security-headers.conf of CodeBlue. This copy has
# other names for the Trusted Types policy of the 3D room (scenity-worker) and the variables ($scenity_web_*). It does
# not have the policy of the service worker of CodeBlue. The resus plugin keeps codeblue-monitor-worker, and the CodeBlue SDK
# keeps codeblue-heartbeat-worker.
# The static server of the editor tests (serve-static.ts, nginxHeaders.ts) reads this file, so the tests
# run the editor build under the same headers as the learner app.
# Keep one add_header per line, with the value in double quotes or as one variable.
# The test server gives no value to the variables, so they are empty.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'sha256-60LHlRjW/B3CtzIoE/Lf1/NEDvko9efWMFaGVhHu/cs=' 'sha256-0sLsI2a+NIcumVvBF9zD/ArGqlZR2xfnxsALPmK7nj8='; connect-src 'self' $scenity_web_csp_connect; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'; require-trusted-types-for 'script'; trusted-types vue scenity-worker codeblue-monitor-worker codeblue-heartbeat-worker; report-uri /v1/telemetry/csp; report-to csp; $scenity_web_csp_upgrade" always;
add_header Reporting-Endpoints "csp=\"/v1/telemetry/csp\"" always;
add_header Strict-Transport-Security $scenity_web_hsts always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), usb=(), payment=(), fullscreen=(self), screen-wake-lock=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
