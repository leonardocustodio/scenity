changes: "Box: the glTF-Draco variant (Box.gltf and Box.bin) as it is. TextureCoordinateTestWebP and TextureCoordinateTestAvif: made from TextureCoordinateTest.glb with glTF-Transform 4.5; the PNG texture is encoded as WebP (quality 90) and AVIF (quality 80) with jSquash, and EXT_texture_webp or EXT_texture_avif is required (no fallback image). The other files are the glTF-Binary files of the repository."
