# Rights record of the CC BY 4.0 models of the glTF samples. The files come from the Khronos glTF-Sample-Assets
# repository. Each model folder there has a metadata.json with the licence and the owner. CC BY 4.0 asks for
# attribution: the attribution text names each owner.
name: khronos-cc-by
source: "Khronos glTF-Sample-Assets, https://github.com/KhronosGroup/glTF-Sample-Assets (downloaded 2026-10-15 from the main branch)"
author: "The authors of each model (see assets)"
licence: "Creative Commons Attribution 4.0 International"
spdx: CC-BY-4.0 # the release gate checks it against release.licences.allow of scenity.project.json
licenceUrl: https://creativecommons.org/licenses/by/4.0/
licenceDate: 2026-10-15
allowedUse: [web, unreal, public]
webDelivery: true
attribution: "Models from the Khronos glTF-Sample-Assets (CC BY 4.0): Transmission Roughness Test, Attenuation Test, Specular Test, Clear Coat Test, Emissive Strength Test and Unlit Test by Ed Mackey, copyright Analytical Graphics, Inc.; Box by Cesium, copyright Cesium; Texture Coordinate Test by Ed Mackey, copyright Analytical Graphics, Inc. (WebP and AVIF variants made for Scenity)."
